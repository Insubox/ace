name: Downloadable CLI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            binary: ace
          - os: macos-14
            target: aarch64-apple-darwin
            binary: ace
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: ace
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: ace.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux static linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p ace-cli --target ${{ matrix.target }}
      - name: Check published executable, demo and generations
        shell: bash
        run: |
          set -euo pipefail
          ace_bin="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          "$ace_bin" --version
          "$ace_bin" demo ace-package-demo --json > demo-summary.json
          "$ace_bin" status ace-package-demo/run
          "$ace_bin" evolve ace-package-evolution --generations 3 --json
          "$ace_bin" history ace-package-evolution
      - name: Package the native binary
        shell: bash
        run: |
          set -euo pipefail
          version=$(target/${{ matrix.target }}/release/${{ matrix.binary }} --version | cut -d ' ' -f 2)
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag must match the executable version" >&2
            exit 1
          fi
          python scripts/package-release.py --binary target/${{ matrix.target }}/release/${{ matrix.binary }} --target ${{ matrix.target }} --version "$version" --commit "$GITHUB_SHA" --out dist
      - name: Verify extracted package, agent proposals and Git history without provider credentials
        shell: bash
        run: |
          set -euo pipefail
          for archive in dist/*.tar.gz dist/*.zip; do
            if [[ -f "$archive" ]]; then python scripts/check-package.py "$archive"; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ace-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ace-*
          merge-multiple: true
          path: dist
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --prerelease --generate-notes --title "ACE $RELEASE_TAG — local technical preview"
