[workspace]
members = ["crates/ace-core", "crates/ace-policy", "crates/ace-protocol", "crates/ace-eval", "crates/ace-runner", "crates/ace-cli"]
resolver = "3"

[workspace.package]
license = "MIT"
version = "0.4.0"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
ace-core = { path = "crates/ace-core" }
ace-policy = { path = "crates/ace-policy" }
ace-protocol = { path = "crates/ace-protocol" }
ace-runner = { path = "crates/ace-runner" }
ace-eval = { path = "crates/ace-eval" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
sha2 = "0.10"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
